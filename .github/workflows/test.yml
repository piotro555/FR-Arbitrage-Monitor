name: Monitor Funding Bitget

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica i file
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa librerie grafico
        run: python -m pip install matplotlib

      - name: Esegui monitor
        run: python funding_monitor.py

      - name: Salva grafico e dati scaricabili
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-rsr-report
          path: report/
          if-no-files-found: warn
